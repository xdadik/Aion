name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify wheel
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Aion Hand ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.whl
          body: |
            # Aion Hand ${{ steps.version.outputs.VERSION }}

            ## Installation

            ```bash
            pip install aion-hand==${{ steps.version.outputs.VERSION }}
            ```

            Or upgrade:

            ```bash
            pip install --upgrade aion-hand
            ```

            See the [CHANGELOG.md](https://github.com/xdadik/Aion/blob/main/CHANGELOG.md) for full details.

            ## Verification

            ```bash
            aion-tui --version
            pytest --tb=no -q
            ```

            ---
            *This release was automated by GitHub Actions.*
