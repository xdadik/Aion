name: Aion CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Run test suite
        run: python -m pytest -q --cov=aion_core --cov-report=term-missing --cov-report=xml
      - name: Compile Python sources
        run: python -m compileall -q aion_core aion_hand_cli

  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Ruff
        run: python -m ruff check aion_core aion_hand_cli tests
      - name: Black check
        run: python -m black --check aion_core aion_hand_cli tests

  security:
    name: Security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[all,dev]"
      - name: Run security regression tests
        run: python -m pytest -q tests/test_secure_sandbox.py
