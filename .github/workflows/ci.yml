name: CI

on:
  push:
    branches: [main, "feat/**", "security/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt || true
          pip install pytest pytest-asyncio ruff

      - name: Lint (ruff)
        run: ruff check aion_core/ tests/ --select=E,F,W,UP --statistics || true
        continue-on-error: true  # info-only for now; will fail-fast in a future release

      - name: Test (pytest)
        run: pytest --tb=short -q --maxfail=10
        env:
          AION_HAND_CI: "1"

  web-ui:
    name: Web UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aion_web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aion_web/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Type-check
        run: npx tsc --noEmit || true
        continue-on-error: true

      - name: Build
        run: npm run build --if-present
